<div class="employee-page">



  <!-- 🔥 FORM -->
  <div class="container-sm">
    <div class="col-md-6 offset-md-3">

      <form #f="ngForm"
            (ngSubmit)="f.form.valid && onSubmit()"
            class="form-container row g-3">

        <!-- FIRST NAME -->
        <div class="form-group col-md-6">
          <label>First Name</label>
          <input type="text" class="form-control"
            [(ngModel)]="employee.fname"
            name="fname"
            required minlength="3"
            #fname="ngModel"
            [ngClass]="{ 'is-invalid': f.submitted && fname.errors }">

          <div *ngIf="f.submitted && fname.errors" class="invalid-feedback">
            <div *ngIf="fname.errors['required']">First name is required</div>
            <div *ngIf="fname.errors['minlength']">Minimum 3 characters required</div>
          </div>
        </div>

        <!-- LAST NAME -->
        <div class="form-group col-md-6">
          <label>Last Name</label>
          <input type="text" class="form-control"
            [(ngModel)]="employee.lname"
            name="lname"
            required
            #lname="ngModel"
            [ngClass]="{ 'is-invalid': f.submitted && lname.errors }">

          <div *ngIf="f.submitted && lname.errors" class="invalid-feedback">
            Last name is required
          </div>
        </div>

        <!-- EMAIL -->
        <div class="form-group col-md-12">
          <label>Email Id</label>
          <input type="email" class="form-control"
            [(ngModel)]="employee.email"
            name="email"
            required email
            #email="ngModel"
            [ngClass]="{ 'is-invalid': f.submitted && email.invalid }">

          <div *ngIf="f.submitted && email.errors" class="invalid-feedback">
            <div *ngIf="email.errors['required']">Email is required</div>
            <div *ngIf="email.invalid">Invalid email format</div>
          </div>
        </div>

        <!-- DEPARTMENT -->
        <div class="form-group col-md-6">
          <label>Department</label>
          <select class="form-select"
            [(ngModel)]="employee.department"
            name="department"
            required
            #department="ngModel"
            [ngClass]="{ 'is-invalid': f.submitted && department.errors }">

            <option disabled selected value="">Choose..</option>
            <option>IT</option>
            <option>HR</option>
            <option>Finance</option>
            <option>Marketing</option>
          </select>

          <div *ngIf="f.submitted && department.errors" class="invalid-feedback">
            Department is required
          </div>
        </div>

        <!-- DESIGNATION -->
        <div class="form-group col-md-6">
          <label>Designation</label>
          <select class="form-select"
            [(ngModel)]="employee.designation"
            name="designation"
            required
            #designation="ngModel"
            [ngClass]="{ 'is-invalid': f.submitted && designation.errors }">

            <option disabled selected value="">Choose..</option>
            <option>Developer</option>
            <option>Manager</option>
            <option>Analyst</option>
            <option>Accountant</option>
          </select>

          <div *ngIf="f.submitted && designation.errors" class="invalid-feedback">
            Designation is required
          </div>
        </div>

        <!-- SALARY -->
        <div class="form-group col-md-6">
          <label>Salary</label>
          <input type="number" class="form-control"
            [(ngModel)]="employee.salary"
            name="salary"
            required
            #salary="ngModel"
            [ngClass]="{ 'is-invalid': f.submitted && salary.errors }">

          <div *ngIf="f.submitted && salary.errors" class="invalid-feedback">
            Salary is required
          </div>
        </div>

        <!-- DATE -->
        <div class="form-group col-md-6">
          <label>Joining Date</label>
          <input type="date" class="form-control"
            [(ngModel)]="employee.joiningDate"
            name="joiningDate"
            required
            #joiningDate="ngModel"
            [ngClass]="{ 'is-invalid': f.submitted && joiningDate.errors }">

          <div *ngIf="f.submitted && joiningDate.errors" class="invalid-feedback">
            Joining date is required
          </div>
        </div>

        <!-- BUTTONS -->
        <div class="col-md-6">
          <button class="btn btn-success full-width-button" type="submit">
            Submit
          </button>
        </div>

        <div class="col-md-6">
          <button type="button"
            (click)="goToEmployeeList()"
            class="btn btn-danger full-width-button">
            Cancel
          </button>
        </div>

      </form>
    </div>
  </div>

</div>
