<div class="page">
  <div class="card-container">

    <h2 class="title">Manage Leave Requests</h2>
    <p class="subtitle">Review and manage employee leave requests efficiently</p>

    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>Email</th>
          <th>Type</th>
          <th>Status</th>
          <th class="text-center">Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let leave of leaves">
          <td>{{leave.employeeEmail}}</td>
<td>{{leave.leaveType}}</td>

          <td>
            <span class="badge"
              [ngClass]="{
                'approved': leave.status === 'APPROVED',
                'rejected': leave.status === 'REJECTED',
                'pending': leave.status === 'PENDING'
              }">
              {{leave.status}}
            </span>
          </td>

          <td class="text-center">
            <button class="icon-btn approve" (click)="approve(leave.id)">✔</button>
            <button class="icon-btn reject" (click)="reject(leave.id)">✖</button>
          </td>
        </tr>
      </tbody>
    </table>

  </div>
</div>
